<svg width="680" height="480" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>MemoryAgent architecture</title>
<desc>User sends chat requests to a FastAPI backend running on Alibaba Cloud, which reads/writes a SQLite memory store, backs it up to Alibaba Cloud OSS, and calls the Qwen Cloud API for chat completions.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="480" fill="#ffffff"/>

<!-- User -->
<rect x="30" y="30" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="58" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">User</text>

<!-- Qwen Cloud API -->
<rect x="480" y="30" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Qwen Cloud API</text>
<text x="565" y="70" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Chat completions</text>

<!-- Outer container: Alibaba Cloud -->
<rect x="80" y="130" width="520" height="320" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="110" y="160" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Alibaba Cloud</text>

<!-- FastAPI backend -->
<rect x="110" y="185" width="220" height="60" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
<text x="220" y="207" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">FastAPI backend</text>
<text x="220" y="225" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">ECS / Function Compute</text>

<!-- Memory store -->
<rect x="110" y="285" width="220" height="60" rx="10" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
<text x="220" y="307" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Memory store</text>
<text x="220" y="325" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">SQLite, recall + decay</text>

<!-- OSS backup -->
<rect x="360" y="285" width="200" height="60" rx="10" fill="#FAC775" stroke="#854F0B" stroke-width="0.5"/>
<text x="460" y="307" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">OSS backup</text>
<text x="460" y="325" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Persists memory.db</text>

<!-- Arrows -->
<line x1="145" y1="86" x2="185" y2="183" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="150" y="120" font-family="sans-serif" font-size="12" fill="#5f5e5a">POST /chat</text>

<path d="M330 205 L 480 205 L 480 86" fill="none" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="345" y="198" font-family="sans-serif" font-size="12" fill="#5f5e5a">completions</text>

<line x1="220" y1="245" x2="220" y2="283" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
<text x="230" y="268" font-family="sans-serif" font-size="12" fill="#5f5e5a">recall / store</text>

<line x1="330" y1="315" x2="358" y2="315" stroke="#5f5e5a" stroke-width="0.5" marker-end="url(#arrow)"/>
</svg>
